[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scala-score"
version = "0.1.0"
description = "Python SDK for S.C.A.L.A. Score API — Search 244M+ companies worldwide"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "S.C.A.L.A. AI OS", email = "ale@get-scala.com" }]
keywords = ["company-data", "business-intelligence", "api", "score", "crm", "scala"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.25.0"]

[project.urls]
Homepage = "https://get-scala.com"
Documentation = "https://get-scala.com/score/api/docs"
Repository = "https://github.com/Alessandro114/scala-score-python"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scala_score"]

[tool.coverage.report]
# 154 righe di client e ogni ramo raggiungibile con un MockTransport: qui il
# 100% e verificabile, non una posa. La soglia impedisce che un metodo nuovo
# entri senza prove.
fail_under = 100
show_missing = true
